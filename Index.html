<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor 1.5</title>
<script>
// Өдөр/шөнийн горимыг хуудас зурагдахаас өмнө тогтооно (анивчихгүй)
(function () {
  var t = null;
  try { t = localStorage.getItem('mdeditor-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<?!= include('Style'); ?>
</head>
<body>
<div class="app">

<div class="appbar">
  <div class="brand">
    <div class="brand-mark"><i class="ti ti-markdown"></i></div>
    <div class="brand-text">
      <div class="brand-title">MD файл засварлагч</div>
      <div class="brand-sub">Мэдээлэл зүйн олимпиадын бодлого бэлтгэгчдэд зориулав.</div>
    </div>
  </div>
  <div class="appbar-right">
    <div class="filechip" id="filechip" title="Цэг харагдвал хадгалаагүй өөрчлөлт байна">
      <i class="ti ti-file-text" id="file-icon"></i><span id="filename">document.md</span><span class="dirty-dot"></span>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()"></button>
  </div>
</div>

<div class="toolbar">
  <div class="tgroup g-text" role="group" aria-label="Текст">
    <button onclick="fmt('**','**')" title="Тод"><b>Т</b></button>
    <button onclick="fmt('_','_')" title="Налуу"><i>Н</i></button>
    <button onclick="fmt('~~','~~')" title="Дундуур зураас" style="text-decoration:line-through;">З</button>
    <button onclick="fmt('`','`')" title="Код" style="font-family:var(--font-mono);">&lt;/&gt;</button>
  </div>
  <div class="tgroup g-head" role="group" aria-label="Гарчиг">
    <button onclick="insLine('# ')" title="Гарчиг 1">H1</button>
    <button onclick="insLine('## ')" title="Гарчиг 2">H2</button>
    <button onclick="insLine('### ')" title="Гарчиг 3">H3</button>
  </div>
  <div class="tgroup g-block" role="group" aria-label="Блок">
    <button onclick="insLine('- ')" title="Жагсаалт"><i class="ti ti-list"></i></button>
    <button onclick="insLine('1. ')" title="Дугаарлагдсан жагсаалт"><i class="ti ti-list-numbers"></i></button>
    <button onclick="insLine('> ')" title="Иш татах"><i class="ti ti-blockquote"></i></button>
    <button onclick="insLine('---\n')" title="Хөндлөн зураас"><i class="ti ti-minus"></i></button>
  </div>
  <div class="tgroup g-insert" role="group" aria-label="Оруулах">
    <button onclick="insLink()" title="Холбоос"><i class="ti ti-link"></i></button>
    <button onclick="insImage()" title="Зураг оруулах (Drive хавтаснаас эсвэл компьютерээс)"><i class="ti ti-photo"></i></button>
    <input type="file" id="img-input" accept="image/*" onchange="insImageFile(event)" style="display:none;">
  </div>
  <div class="tgroup g-math" role="group" aria-label="Томъёо">
    <button onclick="fmt('$','$')" title="Хялбар томъёо">∑</button>
    <button onclick="insDisplayMath()" title="Дэлгэрэнгүй томъёо">∫∫</button>
  </div>
  <div class="tgroup g-page" role="group" aria-label="Хуудас">
    <button id="head-btn" onclick="insHeader()" title="Толгой (header) нэмэх / засах"><i class="ti ti-layout-navbar"></i></button>
    <button id="foot-btn" onclick="insFooter()" title="Хуудасны дугаар нэмэх / хасах"><i class="ti ti-layout-bottombar"></i></button>
  </div>
  <div class="spacer"></div>
  <div class="viewseg" role="group" aria-label="Гүйлгэлт">
    <button id="sync-btn" onclick="toggleSync()" title="Хоёр цонхыг зэрэг гүйлгэх"><i class="ti ti-arrows-vertical"></i></button>
  </div>
  <div class="viewseg" role="group" aria-label="Харагдац">
    <button id="seg-edit" onclick="setLayout('edit')" title="Зөвхөн засварлах"><i class="ti ti-pencil"></i></button>
    <button id="seg-split" class="active" onclick="setLayout('split')" title="Засварлах ба харах"><i class="ti ti-layout-columns"></i></button>
    <button id="seg-view" onclick="setLayout('view')" title="Зөвхөн харах"><i class="ti ti-eye"></i></button>
  </div>
</div>

<div class="editor-area" id="editor-area">
  <div class="pane" id="pane-editor">
    <div class="pane-header">
      <span class="ph-label"><i class="ti ti-pencil"></i> Засварлах цонх</span>
      <span class="ph-actions">
        <button class="ph-btn" onclick="openFile()" title="Файл нээх"><i class="ti ti-upload"></i> Нээх</button>
        <input type="file" id="file-open-input" accept=".md,.markdown,.txt" onchange="loadFile(event)" style="display:none;">
        <button class="ph-btn ph-btn-main" onclick="saveFile()" title="Хадгалах — нэрийг хэвээр дарж бичнэ (Ctrl+S)"><i class="ti ti-download"></i> Хадгалах</button>
        <button class="ph-btn" onclick="saveFileAs()" title="Өөр нэрээр хадгалах"><i class="ti ti-file-plus"></i></button>
        <button class="ph-btn ph-btn-close" onclick="setLayout('view')" title="Засварлах цонхыг хаах"><i class="ti ti-x"></i></button>
      </span>
    </div>
    <textarea id="md-input" spellcheck="false" placeholder="Тэмдэглэгээгээ энд бичнэ үү..."></textarea>
  </div>

  <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="Цонхны өргөнийг өөрчлөх" title="Чирж өргөнийг өөрчилнө · давхар товшвол тэнцүүлнэ"></div>

  <div class="pane" id="pane-preview">
    <div class="pane-header">
      <span class="ph-label"><i class="ti ti-eye"></i> Харах цонх</span>
      <span class="ph-actions">
        <button class="ph-btn ph-btn-pdf" onclick="savePDF()" title="PDF хэлбэрээр хадгалах"><i class="ti ti-file-type-pdf"></i> Хадгалах(PDF) / Хэвлэх</button>
        <button class="ph-btn ph-btn-close" onclick="setLayout('edit')" title="Харах цонхыг хаах"><i class="ti ti-x"></i></button>
      </span>
    </div>
    <div class="preview-scroll" id="md-preview"></div>
  </div>
</div>

<div class="statusbar">
  <div class="status-left">
    <span id="wc"><b>0</b> үг</span>
    <span id="cc"><b>0</b> тэмдэгт</span>
    <span id="lc"><b>0</b> мөр</span>
  </div>
  <div class="status-right">
    <i class="ti ti-math-function"></i> KaTeX · marked.js
    <span class="copyright" style="margin-left:6px; padding-left:10px; border-left:1px solid var(--border2); color:var(--ink2);">© 2026 J.Dashdemberel</span>
  </div>
</div>

</div>

<!-- Зургийн тохиргооны самбар -->
<div class="imgpanel" id="imgpanel" hidden>
  <div class="ip-head">
    <span><i class="ti ti-photo"></i> Зургийн хэмжээ</span>
    <button class="ip-x" onclick="closeImgPanel()" title="Хаах"><i class="ti ti-x"></i></button>
  </div>
  <div class="ip-row">
    <label>Өргөн<input id="ip-w" type="text" placeholder="авто" autocomplete="off"></label>
    <label>Өндөр<input id="ip-h" type="text" inputmode="numeric" placeholder="авто" autocomplete="off"></label>
  </div>
  <div class="ip-quick">
    <button data-w="25%">25%</button>
    <button data-w="50%">50%</button>
    <button data-w="100%">100%</button>
    <button data-w="">Анхны</button>
  </div>
  <div class="ip-label">Текст ороох</div>
  <div class="ip-wrap" role="group" aria-label="Текст ороох">
    <button data-a="" title="Ороохгүй"><i class="ti ti-float-none"></i></button>
    <button data-a="left" title="Зүүн талд — текст баруун талаар нь ороно"><i class="ti ti-float-left"></i></button>
    <button data-a="center" title="Голлуулах"><i class="ti ti-float-center"></i></button>
    <button data-a="right" title="Баруун талд — текст зүүн талаар нь ороно"><i class="ti ti-float-right"></i></button>
  </div>
</div>

<!-- Асуух цонх -->
<div class="modal-back" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-icon" id="modal-icon"></div>
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
// Серверээс (Code.gs → doGet) нээх файлын ID энд орно.
var DRIVE_FILE_ID = '<?!= fileId ?>';
var DRIVE_FOLDER_ID = '<?!= folderId ?>';
</script>
<?!= include('Script'); ?>
</body>
</html>
