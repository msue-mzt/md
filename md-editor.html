<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor 1.0</title>
<script>
// Өдөр/шөнийн горим өөрчлөх
(function () {
  var t = null;
  try { t = localStorage.getItem('mdeditor-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

/* ===== Өнгөний систем (өдрийн горим) ===== */
:root {
  color-scheme: light;
  --bg: #edf2fb;
  --surface: #ffffff;
  --surface2: #f6f8fd;
  --border: #dde4f2;
  --border2: #c5d0e6;
  --ink: #14213d;
  --ink2: #4a5878;
  --ink3: #8d9ab5;

  --navy: #16285a;
  --navy2: #22397a;

  --blue: #2f5bea;   --blue-ink: #2248c9;   --blue-soft: #e6edff;
  --violet: #7b5cf0; --violet-ink: #5d3fd6; --violet-soft: #efeafe;
  --teal: #0f9d8a;   --teal-ink: #0b7d6e;   --teal-soft: #dcf5f1;
  --rose: #d8386b;   --rose-ink: #b8214f;   --rose-soft: #fde6ee;
  --ochre: #e3931b;  --ochre-ink: #a96200;  --ochre-soft: #fdf0d8;

  --stripe: linear-gradient(90deg,
      var(--blue) 0 20%, var(--violet) 20% 40%, var(--teal) 40% 60%,
      var(--rose) 60% 80%, var(--ochre) 80% 100%);

  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 10px 26px -14px rgba(22,40,90,.28);
  --font-ui: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  --font-serif: 'Source Serif 4', Georgia, serif;
  --radius: 14px;
  --radius-sm: 9px;
}

/* ===== Шөнийн горим ===== */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c1224;
  --surface: #131b33;
  --surface2: #19223f;
  --border: #26314f;
  --border2: #36436a;
  --ink: #e7ecf8;
  --ink2: #a8b3cf;
  --ink3: #6c7899;

  --navy: #0a1330;
  --navy2: #16254f;

  --blue: #6c8dff;   --blue-ink: #95adff;   --blue-soft: #1c2a55;
  --violet: #a38cff; --violet-ink: #bfb0ff; --violet-soft: #2a2152;
  --teal: #2fc9b2;   --teal-ink: #62dcc9;   --teal-soft: #11332f;
  --rose: #ff6b98;   --rose-ink: #ff94b4;   --rose-soft: #3a1726;
  --ochre: #ffb347;  --ochre-ink: #ffc877;  --ochre-soft: #36260c;

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px -16px rgba(0,0,0,.7);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
body { transition: background-color .2s, color .2s; }

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  max-width: 1440px;
  margin: 0 auto;
  padding: 14px;
  gap: 12px;
}

/* ===== Дээд самбар ===== */
.appbar {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px 18px;
  background: var(--navy);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  color: #fff;
  overflow: hidden;
}
.appbar::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 5px;
  background: var(--stripe);
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--ochre);
  color: var(--navy);
  font-size: 22px;
  flex-shrink: 0;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.brand-title { font-size: 17px; font-weight: 700; letter-spacing: .005em; }
.brand-sub { font-size: 12px; color: rgba(255,255,255,.72); }

.appbar-right { display: flex; align-items: center; gap: 10px; min-width: 0; }

.filechip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  background: var(--navy2);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  max-width: 46vw;
  min-width: 0;
  white-space: nowrap;
}
.filechip i { color: var(--ochre); }
.filechip #filename { overflow: hidden; text-overflow: ellipsis; }
.dirty-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ochre); flex-shrink: 0; display: none; }
.filechip.dirty .dirty-dot { display: inline-block; }

.theme-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  flex-shrink: 0;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.16);
  background: var(--navy2);
  color: var(--ochre);
  font-size: 19px;
  cursor: pointer;
  transition: background .14s, transform .05s;
}
.theme-btn:hover { background: rgba(255,255,255,.16); }
.theme-btn:active { transform: translateY(1px); }
.theme-btn:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }

/* ===== Хэрэгслийн мөр ===== */
.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}

.tgroup {
  --c: var(--blue); --c-ink: var(--blue-ink); --c-soft: var(--blue-soft);
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  background: var(--c-soft);
  border-radius: 11px;
}
.tgroup.g-head   { --c: var(--violet); --c-ink: var(--violet-ink); --c-soft: var(--violet-soft); }
.tgroup.g-block  { --c: var(--teal);   --c-ink: var(--teal-ink);   --c-soft: var(--teal-soft); }
.tgroup.g-insert { --c: var(--rose);   --c-ink: var(--rose-ink);   --c-soft: var(--rose-soft); }
.tgroup.g-math   { --c: var(--ochre);  --c-ink: var(--ochre-ink);  --c-soft: var(--ochre-soft); }
.tgroup.g-page   { --c: var(--navy2);  --c-ink: var(--blue-ink);   --c-soft: var(--blue-soft); }

.tgroup button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  padding: 6px 10px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--c-ink);
  font-family: var(--font-ui);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .14s, color .14s, transform .05s;
}
.tgroup button:hover { background: var(--c); color: #fff; }
.tgroup button:active { transform: translateY(1px); }
.tgroup.g-math button { font-size: 16px; }
.tgroup.g-page button { font-size: 16px; }
.tgroup.g-page button.active { background: var(--c); color: #fff; }

.toolbar button:focus-visible { outline: 2px solid var(--c, var(--blue)); outline-offset: 2px; }
.toolbar .spacer { flex: 1; min-width: 8px; }

.viewseg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 11px;
}
.viewseg button {
  min-width: 36px;
  padding: 6px 10px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--ink3);
  font-size: 15px;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.viewseg button:hover { color: var(--navy); background: var(--border); }
.viewseg button.active { background: var(--navy); color: #fff; }
[data-theme="dark"] .viewseg button:hover { color: var(--ink); }
[data-theme="dark"] .viewseg button.active { background: var(--blue); }

/* ===== Бичих ба харах цонх ===== */
.editor-area { display: flex; gap: 0; flex: 1; min-height: 0; }

.pane {
  --c: var(--ochre); --c-ink: var(--ochre-ink); --c-soft: var(--ochre-soft);
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 4px solid var(--c);
  border-radius: var(--radius);
  overflow: hidden;
  min-width: 0;
  box-shadow: var(--shadow);
}
#pane-preview { --c: var(--teal); --c-ink: var(--teal-ink); --c-soft: var(--teal-soft); }
.pane.is-hidden { display: none; }

/* Хоёр цонхны хоорондох чирэх зураас */
.divider {
  flex: 0 0 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: col-resize;
  touch-action: none;
  outline: none;
}
.divider::before {
  content: "";
  width: 4px;
  height: 48px;
  border-radius: 4px;
  background: var(--border2);
  transition: background .14s, height .14s;
}
.divider:hover::before,
.divider.dragging::before,
.divider:focus-visible::before { background: var(--blue); height: 96px; }
.divider.is-hidden { display: none; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing .pane { pointer-events: none; }

.pane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  padding: 8px 10px 8px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--c-soft);
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-ink);
  flex-shrink: 0;
}
.pane-header .ph-label { display: flex; align-items: center; gap: 8px; }
.pane-header .ph-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.ph-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: var(--surface);
  color: var(--c-ink);
  font-family: var(--font-ui);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .14s, color .14s, transform .05s;
}
.ph-btn:hover { background: var(--c); color: #fff; }
.ph-btn:active { transform: translateY(1px); }
.ph-btn:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
.ph-btn.ph-btn-main { background: var(--c); color: #fff; }
.ph-btn.ph-btn-main:hover { background: var(--c-ink); }
.ph-btn-pdf { --c: var(--rose); --c-ink: var(--rose-ink); background: var(--rose); color: #fff; }
.ph-btn-pdf:hover { background: var(--rose-ink); }
.ph-btn-close { padding: 6px 8px; background: transparent; color: var(--ink3); }
.ph-btn-close:hover { background: var(--c); color: #fff; }
.ph-btn-close i { font-size: 16px; }

textarea {
  flex: 1;
  resize: none;
  border: none;
  outline: none;
  padding: 20px 22px;
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.7;
  background: var(--surface);
  color: var(--ink);
  tab-size: 2;
  caret-color: var(--ochre);
  font-variant-ligatures: none;   /* <!-- , --> зэрэг тэмдэгт сум болж харагдахгүй */
  font-feature-settings: "liga" 0, "calt" 0;
}

textarea::selection { background: #ffc94d; color: #14213d; }
[data-theme="dark"] textarea::selection { background: #e3931b; color: #0c1224; }

.preview-scroll { flex: 1; overflow-y: auto; padding: 24px 28px; font-family: var(--font-serif); }

/* ===== Харах хэсгийн хэв маяг ===== */
.preview-scroll h1 {
  font-family: var(--font-ui); font-size: 26px; font-weight: 800; color: var(--navy);
  margin: 0 0 18px; padding-bottom: 12px;
  background: var(--stripe) left bottom / 100% 4px no-repeat;
}
[data-theme="dark"] .preview-scroll h1 { color: var(--ink); }
.preview-scroll h2 {
  font-family: var(--font-ui); font-size: 19px; font-weight: 700; color: var(--blue-ink);
  margin: 28px 0 12px; padding: 4px 0;
}
.preview-scroll h3 { font-family: var(--font-ui); font-size: 15.5px; font-weight: 700; margin: 20px 0 8px; color: var(--teal-ink); }
.preview-scroll h1, .preview-scroll h2, .preview-scroll hr { clear: both; }
.preview-scroll .doc-head {
  display: flex; justify-content: space-between; gap: 12px;
  font-family: var(--font-ui); font-size: 12px; color: var(--ink2);
  padding-bottom: 7px; margin-bottom: 20px;
  background: var(--stripe) left bottom / 100% 2px no-repeat;
}
.preview-scroll .doc-head b { color: var(--navy); font-weight: 800; }
[data-theme="dark"] .preview-scroll .doc-head b { color: var(--ink); }
.preview-scroll .doc-foot {
  clear: both; margin-top: 28px; padding-top: 7px; text-align: center;
  font-family: var(--font-ui); font-size: 12px; color: var(--ink2);
  background: var(--stripe) left top / 100% 2px no-repeat;
}
.preview-scroll p { margin: 0 0 13px; line-height: 1.8; }
.preview-scroll ul, .preview-scroll ol { margin: 0 0 13px; padding-left: 24px; }
.preview-scroll li { margin: 5px 0; line-height: 1.7; }
.preview-scroll ul li::marker { color: var(--teal); }
.preview-scroll ol li::marker { color: var(--violet); font-family: var(--font-ui); font-weight: 700; }
.preview-scroll code { font-family: var(--font-mono); font-size: 12.5px; background: var(--rose-soft); color: var(--rose-ink); padding: 2px 6px; border-radius: 6px; }

/* Кодын/жишээний блок: зөвхөн текстийнхээ хэмжээнд, мөр хоорондын зай нягт */
.preview-scroll pre {
  display: block;
  width: fit-content;
  min-width: min(220px, 100%);
  max-width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  overflow-x: auto;
  margin: 0 0 14px;
  line-height: 1.45;
}
.preview-scroll pre code { display: block; background: none; color: var(--ink); padding: 0; font-size: 13px; line-height: inherit; }

/* Багана: <!-- cols --> ... <!-- col --> ... <!-- /cols --> */
.preview-scroll .md-cols { display: grid; gap: 24px; align-items: start; margin: 0 0 4px; }
.preview-scroll .md-col { min-width: 0; }
.preview-scroll .md-col > :first-child { margin-top: 0; }

.preview-scroll table { border-collapse: separate; border-spacing: 0; width: 100%; margin: 0 0 14px; font-family: var(--font-ui); font-size: 13.5px; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.preview-scroll th, .preview-scroll td { padding: 9px 13px; border-bottom: 1px solid var(--border); }
.preview-scroll th { background: var(--blue); color: #fff; font-weight: 700; }
.preview-scroll tr:last-child td { border-bottom: none; }
.preview-scroll tr:nth-child(even) td { background: var(--blue-soft); }
.preview-scroll blockquote { border-left: 4px solid var(--ochre); background: var(--ochre-soft); margin: 0 0 14px; padding: 3px 12px; border-radius: 0 6px 6px 0; color: var(--ink2); font-style: italic; line-height: 1.55; }
.preview-scroll blockquote p { margin: 0 0 4px; line-height: 1.55; }
.preview-scroll blockquote > :last-child { margin-bottom: 0; }
.preview-scroll hr { border: none; height: 3px; background: var(--stripe); border-radius: 3px; margin: 24px 0; opacity: .8; }
.preview-scroll a { color: var(--blue-ink); text-decoration-color: var(--blue); text-underline-offset: 3px; }
.preview-scroll strong { font-weight: 700; color: var(--ink); }
.preview-scroll em { font-style: italic; color: var(--violet-ink); }
.preview-scroll del { color: var(--ink3); }

/* Зураг: хэмжээ + текст ороолт (square wrap) */
.preview-scroll img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 4px 0 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.preview-scroll img.img-left   { float: left;  margin: 4px 18px 10px 0; }
.preview-scroll img.img-right  { float: right; margin: 4px 0 10px 18px; }
.preview-scroll img.img-center { margin-left: auto; margin-right: auto; }
.preview-scroll img.is-selected { outline: 3px solid var(--rose); outline-offset: 3px; }

.katex-display { overflow-x: auto; overflow-y: hidden; margin: 12px 0; padding: 8px 0; }

/* ===== Кодын түлхүүр үгийн өнгө (highlight.js) ===== */
.preview-scroll .hljs-keyword,
.preview-scroll .hljs-selector-tag     { color: var(--violet-ink); font-weight: 600; }
.preview-scroll .hljs-type,
.preview-scroll .hljs-built_in,
.preview-scroll .hljs-class .hljs-title,
.preview-scroll .hljs-title.class_     { color: var(--teal-ink); }
.preview-scroll .hljs-title.function_,
.preview-scroll .hljs-title            { color: var(--blue-ink); }
.preview-scroll .hljs-string,
.preview-scroll .hljs-char             { color: var(--ochre-ink); }
.preview-scroll .hljs-number,
.preview-scroll .hljs-literal          { color: var(--rose-ink); }
.preview-scroll .hljs-meta,
.preview-scroll .hljs-meta .hljs-keyword { color: var(--rose-ink); font-weight: 400; }
.preview-scroll .hljs-meta .hljs-string { color: var(--ochre-ink); }
.preview-scroll .hljs-comment,
.preview-scroll .hljs-doctag           { color: var(--ink3); font-style: italic; }
.preview-scroll .hljs-operator,
.preview-scroll .hljs-punctuation      { color: var(--ink2); }

/* ===== Зургийн тохиргооны самбар ===== */
.imgpanel {
  position: fixed;
  z-index: 40;
  width: 262px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 4px solid var(--rose);
  border-radius: var(--radius);
  box-shadow: 0 18px 40px -16px rgba(10,18,40,.45);
  font-family: var(--font-ui);
  font-size: 12.5px;
  color: var(--ink);
}
.ip-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; color: var(--rose-ink); margin-bottom: 10px; }
.ip-head span { display: inline-flex; align-items: center; gap: 6px; }
.ip-x { border: none; background: transparent; color: var(--ink3); font-size: 16px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.ip-x:hover { background: var(--rose); color: #fff; }
.ip-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.ip-row label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; color: var(--ink2); }
.ip-row input {
  width: 100%;
  padding: 6px 9px;
  border: 1px solid var(--border2);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 12.5px;
}
.ip-row input:focus { outline: 2px solid var(--rose); outline-offset: 0; border-color: transparent; }
.ip-quick { display: flex; gap: 4px; margin-bottom: 10px; }
.ip-quick button, .ip-wrap button {
  flex: 1;
  padding: 5px 0;
  border: none;
  border-radius: 7px;
  background: var(--rose-soft);
  color: var(--rose-ink);
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background .14s, color .14s;
}
.ip-wrap button { font-size: 17px; padding: 5px 0 3px; }
.ip-quick button:hover, .ip-wrap button:hover { background: var(--rose); color: #fff; }
.ip-wrap button.active { background: var(--rose); color: #fff; }
.ip-quick button:focus-visible, .ip-wrap button:focus-visible, .ip-x:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
.ip-label { font-weight: 600; color: var(--ink2); margin-bottom: 4px; }
.ip-wrap { display: flex; gap: 4px; }
.ip-hint { margin-top: 9px; color: var(--ink3); font-size: 11.5px; line-height: 1.45; }

/* ===== Асуух цонх (modal) ===== */
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(10,18,40,.5);
}
.modal {

// Засварлах цонхонд урт кодын оронд img:N гэж харагдана.
const imageStore = {};
let imgCounter = 0;

const IMG_MAX_DIM = 1280;
const IMG_QUALITY = 0.82;

function shrinkImage(dataURI) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const scale = Math.min(1, IMG_MAX_DIM / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      let hasAlpha = false;
      try {
        const d = ctx.getImageData(0, 0, w, h).data;
        for (let i = 3; i < d.length; i += 4) { if (d[i] < 255) { hasAlpha = true; break; } }
      } catch (e) {}
      let out;
      if (hasAlpha) {
        out = cv.toDataURL('image/png');
      } else {
        const c2 = document.createElement('canvas');
        c2.width = w; c2.height = h;
        const x2 = c2.getContext('2d');
        x2.fillStyle = '#fff'; x2.fillRect(0, 0, w, h);
        x2.drawImage(cv, 0, 0);
        out = c2.toDataURL('image/jpeg', IMG_QUALITY);
      }
      resolve(out.length < dataURI.length ? out : dataURI);
    };
    img.onerror = () => resolve(dataURI);
    img.src = dataURI;
  });
}

function addImage(dataURI) {
  imgCounter++;
  imageStore[imgCounter] = dataURI;
  return 'img:' + imgCounter;
}
function expandImages(text) {
  return text.replace(/\]\(img:(\d+)\)/g, (m, id) =>
    imageStore[id] ? '](' + imageStore[id] + ')' : m);
}
function stashImages(text) {
  return text.replace(/\]\((data:[^)]+)\)/g, (m, uri) => {
    imgCounter++;
    imageStore[imgCounter] = uri;
    return '](img:' + imgCounter + ')';
  });
}
async function placeImage(dataURI) {
  const small = await shrinkImage(dataURI);
  return addImage(small);
}

function renderMath(html) {
  return html
    .replace(/\$\$([^$]+?)\$\$/gs, (_, tex) => {
      try { return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false }); }
      catch(e) { return '<code>' + tex + '</code>'; }
    })
    .replace(/\$([^$\n]+?)\$/g, (_, tex) => {
      try { return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false }); }
      catch(e) { return '<code>' + tex + '</code>'; }
    });
}

// ===== Багана =====
// <!-- cols --> ... <!-- col --> ... <!-- /cols -->  → хажуу хажуудаа багана
const COLS_RE = /^[ \t]*<!--\s*cols\s*-->[ \t]*$([\s\S]*?)^[ \t]*<!--\s*\/cols\s*-->[ \t]*$/gim;
const COL_SPLIT = /^[ \t]*<!--\s*col\s*-->[ \t]*$/gim;
function parseMd(text) {
  let out = '', last = 0, m;
  COLS_RE.lastIndex = 0;
  while ((m = COLS_RE.exec(text))) {
    out += marked.parse(text.slice(last, m.index));
    const cols = m[1].split(COL_SPLIT);
    out += '<div class="md-cols" style="grid-template-columns:repeat(' + cols.length + ',minmax(0,1fr));">' +
      cols.map(c => '<div class="md-col">' + marked.parse(c) + '</div>').join('') + '</div>';
    last = m.index + m[0].length;
  }
  return out + marked.parse(text.slice(last));
}
function insCols() {
  const s = input.selectionStart;
  const val = input.value;
  const atStart = s === val.lastIndexOf('\n', s - 1) + 1;
  const fence = '\x60\x60\x60';
  const block = (atStart ? '' : '\n') +
    '<!-- cols -->\n## Жишээ 1\n\nОролт\n' + fence + '\n\n' + fence + '\nГаралт\n' + fence + '\n\n' + fence + '\n' +
    '<!-- col -->\n## Жишээ 2\n\nОролт\n' + fence + '\n\n' + fence + '\nГаралт\n' + fence + '\n\n' + fence + '\n' +
    '<!-- /cols -->\n';
  input.setRangeText(block, s, s, 'end');
  const pos = s + block.indexOf(fence) + 4;   // эхний Оролт блок дотор курсор
  input.setSelectionRange(pos, pos);
  input.focus(); changed();
}

// Бичлэг: ![нэр|өргөн|байрлал](url)  ·  өргөн: 300, 50%, 300x200, x200  ·  байрлал: left | right | center
const SIZE_RE = /^(\d+%?)?(?:x(\d+))?$/i;
function parseAlt(alt) {
  const parts = (alt || '').split('|');
  const r = { name: parts.shift(), w: '', h: '', align: '' };
  for (const p of parts) {
    const s = p.trim().toLowerCase();
    if (!s) continue;
    if (s === 'left' || s === 'right' || s === 'center') { r.align = s; continue; }
    const m = s.match(SIZE_RE);
    if (m) { r.w = m[1] || ''; r.h = m[2] || ''; }
  }
  return r;
}
function buildAlt(r) {
  let s = r.name;
  if (r.w || r.h) s += '|' + (r.w || '') + (r.h ? 'x' + r.h : '');
  if (r.align) s += '|' + r.align;
  return s;
}
function decorateImages() {
  preview.querySelectorAll('img').forEach((img, i) => {
    const r = parseAlt(img.getAttribute('alt'));
    img.alt = r.name.trim();
    img.dataset.idx = i;
    img.title = 'Хэмжээ, байрлалыг тохируулна';
    if (r.w) img.style.width = /%$/.test(r.w) ? r.w : r.w + 'px';
    if (r.h) img.style.height = r.h + 'px';
    if (r.align) img.classList.add('img-' + r.align);
  });
}

// Эх бичвэр дэх зургуудын байрлал (кодын блок доторхыг тооцохгүй)
const IMG_MD = /!\[([^\]\n]*)\]\(([^)\s]*)((?:\s+"[^"\n]*")?)\)/g;
function sourceImages(text) {
  const masked = text
    .replace(/^(`{3,}|~{3,})[^\n]*\n[\s\S]*?^\1[ \t]*$/gm, m => m.replace(/[^\n]/g, ' '))
    .replace(/`[^`\n]+`/g, m => ' '.repeat(m.length));
  const out = [];
  IMG_MD.lastIndex = 0;
  let m;
  while ((m = IMG_MD.exec(masked))) out.push({ start: m.index, end: m.index + m[0].length });
  return out;
}
function readSourceImage(idx) {
  const it = sourceImages(input.value)[idx];
  if (!it) return null;
  const raw = input.value.slice(it.start, it.end);
  const m = raw.match(/^!\[([^\]\n]*)\]\(([^)\s]*)((?:\s+"[^"\n]*")?)\)$/);
  return m ? { it, raw, alt: m[1], url: m[2], title: m[3] } : null;
}
function updateImage(idx, patch) {
  const s = readSourceImage(idx);
  if (!s) return;
  const r = Object.assign(parseAlt(s.alt), patch);
  const next = '![' + buildAlt(r) + '](' + s.url + s.title + ')';
  if (next === s.raw) return;
  input.setRangeText(next, s.it.start, s.it.end, 'preserve');
  changed();
}

// ===== Толгой ба хуудасны дугаар =====
// <!-- header: Зүүн · баруун · ... -->
// <!-- footer: page -->        → 1, 2, 3 ...
// <!-- footer: page/pages -->  → 1 / 3, 2 / 3 ...
const HEAD_RE = /<!--\s*header:\s*([\s\S]*?)\s*-->[ \t]*\n?/i;
const FOOT_RE = /<!--\s*footer:\s*([\s\S]*?)\s*-->[ \t]*\n?/i;

function escHTML(t) { return t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function headerHTML(cls) {
  const hm = input.value.match(HEAD_RE);
  if (!hm || !hm[1].trim()) return '';
  const parts = hm[1].split('·').map(x => x.trim()).filter(Boolean);
  const left = escHTML(parts.shift() || '');
  const right = escHTML(parts.join(' · '));
  return '<div class="' + cls + '"><b>' + left + '</b><span>' + right + '</span></div>';
}
// Хөл: «·»-ээр хуваана. 1 хэсэг → голд, 2 → зүүн · баруун, 3 → зүүн · гол · баруун.
// page → хуудасны дугаар, pages → нийт хуудас, page/pages → 1 / 3
function footerParts() {
  const m = input.value.match(FOOT_RE);
  if (!m || !m[1].trim()) return null;
  const p = m[1].split('·').map(x => x.trim());
  if (p.length === 1) return ['', p[0], ''];
  if (p.length === 2) return [p[0], '', p[1]];
  return [p[0], p.slice(1, -1).join(' · '), p[p.length - 1]];
}
function footerMode() { return footerParts() ? 'on' : ''; }

const PAGE_TOKEN = /(page\/pages|pages|page)/gi;
// Харах цонхонд: page → 1, pages → N
function footerTextPreview(s) {
  return escHTML(s).replace(PAGE_TOKEN, t => {
    t = t.toLowerCase();
    return t === 'page/pages' ? '1 / N' : t === 'pages' ? 'N' : '1';
  });
}
// PDF-д: @page margin box-ийн content утга
function footerCSSContent(s) {
  const out = s.split(PAGE_TOKEN).filter(x => x !== '').map(x => {
    const t = x.toLowerCase();
    if (t === 'page/pages') return 'counter(page) " / " counter(pages)';
    if (t === 'pages') return 'counter(pages)';
    if (t === 'page') return 'counter(page)';
    return '"' + x.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
  });
  return out.length ? out.join(' ') : 'none';
}
function footerPreview() {
  const f = footerParts();
  if (!f) return '';
  const al = ['left', 'center', 'right'];
  return '<div class="doc-foot" style="display:flex;gap:12px;">' +
    f.map((s, i) => '<span style="flex:1;text-align:' + al[i] + ';">' + footerTextPreview(s) + '</span>').join('') +
    '</div>';
}
function insHeader() {
  const m = input.value.match(HEAD_RE);
  if (m) {                       // байгаа бол текстийг нь сонгож засуулна
    const s = m.index + m[0].indexOf(':') + 1;
    const e = m.index + m[0].lastIndexOf('-->');
    const seg = input.value.slice(s, e);
    const lead = seg.length - seg.trimStart().length;
    const trail = seg.length - seg.trimEnd().length;
    input.focus();
    input.setSelectionRange(s + lead, Math.max(s + lead, e - trail));
    return;
  }
  input.setRangeText('<!-- header: Олимпиад · Бодлого 1 · Ангилал -->\n', 0, 0, 'end');
  input.focus(); changed();
}
function insFooter() {
  const m = input.value.match(FOOT_RE);
  if (m) {
    input.setRangeText('', m.index, m.index + m[0].length, 'end');   // байгаа бол хасна
  } else {
    const h = input.value.match(HEAD_RE);
    const pos = h ? h.index + h[0].length : 0;                         // header-ийн дараа
    input.setRangeText('<!-- footer: page -->\n', pos, pos, 'end');
  }
  input.focus(); changed();
}

// Зөвхөн харагдах текстийг тоолно: <!-- header/footer -->, #, **, ``` зэрэг тэмдэглэгээ,
// зураг тоологдохгүй. Томъёо нь харагдах хэлбэрээрээ (n≤10⁵) тоологдоно.
const statBox = document.createElement('div');
function textStats() {
  const c = preview.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('.doc-head, .doc-foot, img, .katex-mathml').forEach(e => e.remove());
  statBox.style.cssText = 'position:absolute;left:-99999px;top:0;overflow:hidden;width:' +
    (preview.clientWidth || 600) + 'px;';
  statBox.replaceChildren(c);
  if (!statBox.isConnected) document.body.appendChild(statBox);
  const t = c.innerText || '';
  statBox.replaceChildren();
  const trimmed = t.trim();
  return {
    words: trimmed ? trimmed.split(/\s+/).length : 0,
    chars: t.replace(/\n/g, '').trim().length,
    lines: t.split('\n').filter(l => l.trim()).length
  };
}

let syncOn = lsGet('mdeditor-sync') !== 'off';
let syncSrc = null, syncTimer = 0;
function syncFrom(src, dst) {
  if (!syncOn) return;
  if (syncSrc && syncSrc !== src) return;   // нөгөө талаас ирсэн гүйлгэлтийн цуурай
  syncSrc = src;
  const max = src.scrollHeight - src.clientHeight;
  const ratio = max > 0 ? src.scrollTop / max : 0;
  dst.scrollTop = ratio * (dst.scrollHeight - dst.clientHeight);
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncSrc = null; }, 120);
}
input.addEventListener('scroll', () => syncFrom(input, preview), { passive: true });
preview.addEventListener('scroll', () => {
  syncFrom(preview, input);
  if (ipIdx >= 0) { const img = currentImg(); if (img) positionImgPanel(img); }

function insertAtCursor(text) {
  const s = input.selectionStart, e = input.selectionEnd;
  input.setRangeText(text, s, e, 'end');
  input.focus(); changed();
}

// Зургийн товч: компьютерээс зураг сонгоно

function insImageFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const alt = file.name.replace(/\.[^.]+$/, '').replace(/[|\]]/g, ' ');
    placeImage(e.target.result).then(ref => {
      insertAtCursor('\n![' + alt + '](' + ref + ')\n');
    });
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

input.addEventListener('paste', (ev) => {
  const items = ev.clipboardData && ev.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.indexOf('image') === 0) {
      ev.preventDefault();
      const file = it.getAsFile();
      const reader = new FileReader();
      reader.onload = e => placeImage(e.target.result).then(ref => insertAtCursor('\n![зураг](' + ref + ')\n'));
      reader.readAsDataURL(file);
      return;
    }
  }
});

function fmt(before, after) {
  const s = input.selectionStart, e = input.selectionEnd;

}

function insLine(prefix) {

// Normal: сонгосон текст (сонголтгүй бол курсор байгаа мөр)-ийн Markdown хэлбэржүүлэлтийг арилгана.
// $...$ томъёонд хүрэхгүй. Ctrl+Z-оор буцаана.
function clearFormat() {
  const v = input.value;
  let s = input.selectionStart, e = input.selectionEnd;
  if (s === e) {
    s = v.lastIndexOf('\n', s - 1) + 1;
    const n = v.indexOf('\n', e);
    e = n === -1 ? v.length : n;
  } else {
    // Сонголтын хажуудах ** ~~ ` тэмдэгтүүдийг хамруулна
    while (s > 0 && '*~`'.includes(v[s - 1])) s--;
    while (e < v.length && '*~`'.includes(v[e])) e++;
  }
  const lineStart = s === 0 || v[s - 1] === '\n';

  const strip = str => str
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/__(.+?)__/g, '$1')
    .replace(/\*(.+?)\*/g, '$1')
    .replace(/(^|[^\w\\])_(?!\s)([^_\n]+?)_(?!\w)/g, '$1$2')
    .replace(/~~?(.+?)~~?/g, '$1')
    .replace(/`([^`]+)`/g, '$1');

  // Томъёоны хэсгийг (сондгой индекс) хэвээр үлдээнэ
  let t = v.slice(s, e)
    .split(/(\$\$[\s\S]*?\$\$|\$[^$\n]*\$)/)
    .map((part, i) => i % 2 ? part : strip(part))
    .join('');

  t = t.split('\n').map((ln, i) =>
    (i > 0 || lineStart) ? ln.replace(/^\s*(#{1,6}\s+|>\s?|[-*+]\s+|\d+\.\s+)/, '') : ln
  ).join('\n');

  if (t === v.slice(s, e)) { input.focus(); return; }
  input.focus();
  input.setSelectionRange(s, e);
  if (!document.execCommand('insertText', false, t)) {
    input.setRangeText(t, s, e, 'select');
    changed();
  }
}

function insDisplayMath() {
  const s = input.selectionStart;
  const block = '\n$$\n\n$$\n';
  input.setRangeText(block, s, s, 'end');
  const pos = s + 4;
  input.setSelectionRange(pos, pos);
  input.focus(); changed();
}

// ===== Асуух цонх =====
// input өгвөл текст оруулах талбартай; тэгвэл { value, text } буцаана.
function showModal({ icon = 'ti-alert-triangle', title, text, buttons, input: inputValue, placeholder }) {
  return new Promise(resolve => {
    const back = document.getElementById('modal');
    const acts = document.getElementById('modal-actions');
    document.getElementById('modal-icon').innerHTML = '<i class="ti ' + icon + '"></i>';
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-text').textContent = text;
    acts.innerHTML = '';
    const prevFocus = document.activeElement;

    let field = null;
    if (inputValue != null) {
      field = document.createElement('input');
      field.type = 'text';
      field.className = 'modal-input';
      field.value = inputValue;
      field.placeholder = placeholder || '';
      field.autocomplete = 'off';
      field.spellcheck = false;
      acts.parentNode.insertBefore(field, acts);
    }

    function done(v) {
      const txt = field ? field.value : null;
      if (field) field.remove();
      back.hidden = true;
      document.removeEventListener('keydown', onKey, true);
      if (prevFocus && prevFocus.focus) prevFocus.focus();
      resolve(field ? { value: v, text: txt } : v);
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done('cancel'); }
      else if (e.key === 'Enter' && field && e.target === field) {
        e.preventDefault();
        const main = acts.querySelector('.mbtn-main');
        if (main) main.click();
      }
    }
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.className = 'mbtn ' + (b.cls || '');
      el.innerHTML = (b.icon ? '<i class="ti ' + b.icon + '"></i>' : '') + '<span></span>';
      el.querySelector('span').textContent = b.label;
      el.onclick = () => done(b.value);
      acts.appendChild(el);
    });
    back.onclick = e => { if (e.target === back) done('cancel'); };
    document.addEventListener('keydown', onKey, true);
    back.hidden = false;
    if (field) { field.focus(); field.select(); }
    else (acts.querySelector('.mbtn-main') || acts.firstChild).focus();
  });
}

// ===== Хадгалах =====
// Компьютер дээрх .html файлаар нээсэн үед (File System Access API) нээсэн файлаа
// яг дээр нь дарж хадгална. Apps Script дотор энэ эрх байхгүй тул Downloads руу татна.
// iframe дотор (Apps Script) файл сонгогч хориотой тул шууд татах горимд ажиллана
let fsOk = 'showOpenFilePicker' in window && 'showSaveFilePicker' in window && window.self === window.top;
let fileHandle = null;   // нээсэн / хадгалсан файлын холбоос
const MD_TYPES = [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }];

function fsFailed(e) {
  if (e && e.name === 'SecurityError') { fsOk = false; return true; }   // iframe дотор зөвшөөрөлгүй
  return false;
}
async function writeHandle(h, text) {
  const w = await h.createWritable();
  await w.write(text);
  await w.close();
}

function downloadFile(content, name) {
  const blob = new Blob([content], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Нээсэн файл руу асуултгүй дарж хадгална
async function saveFile() {
  const text = expandImages(input.value);
  if (fsOk && fileHandle) {
    try {
      await writeHandle(fileHandle, text);
      setDirty(false);
      return true;
    } catch (e) {
      if (e.name === 'AbortError' || e.name === 'NotAllowedError') return false;
      console.error(e);
      alert('Хадгалж чадсангүй: ' + e.message);
      return false;
    }
  }
  if (fsOk) {                              // шинэ файл: нэг удаа хаана хадгалахыг сонгоно
    const r = await saveFileAs(true);
    if (r !== null) return r;              // null → файл сонгогч хориотой, доор шууд татна
  }
  downloadFile(text, currentName());
  setDirty(false);
  return true;
}

// Нэр, байршлыг сонгож хадгална
async function saveFileAs(fromSave) {
  if (fsOk) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: currentName(), types: MD_TYPES });
      await writeHandle(h, expandImages(input.value));
      fileHandle = h;
      setFileName(h.name);
      setDirty(false);
      return true;
    } catch (e) {
      if (e.name === 'AbortError') return false;
      if (!fsFailed(e)) { console.error(e); alert('Хадгалж чадсангүй: ' + e.message); return false; }
      if (fromSave === true) return null;  // Хадгалах товчоос ирсэн бол нэр асуухгүй
    }
  }
  const r = await showModal({
    icon: 'ti-file-plus',
    title: 'Өөр нэрээр хадгалах',
    text: 'Файлын нэр:',
    input: currentName(),
    buttons: [
      { label: 'Цуцлах', value: 'cancel' },
      { label: 'Хадгалах', value: 'save', cls: 'mbtn-main', icon: 'ti-download' }
    ]
  });
  if (r.value !== 'save') return false;
  setFileName(normName(r.text));
  return saveFile();
}

  pre code { display: block; background: none; color: #14213d; padding: 0; font-size: 10.5pt; line-height: inherit; }

function savePDF() {
  closeImgPanel();
  const title = (document.getElementById('filename').textContent || 'document').replace(/\.(md|markdown|txt)$/i, '') || 'document';

  // Шинэ цонхонд хэвлэнэ: PDF-ийн нэр нь энэ цонхны гарчиг (MD файлын нэр) болно.
  // (iframe-ээр хэвлэвэл Chrome Apps Script хуудасны гарчгийг авдаг)
  const win = window.open('', '_blank');
  if (!win) { alert('Popup хаагдсан байна. Хаягийн мөрний баруун талаас энэ хуудсанд popup зөвшөөрнө үү.'); return; }

  // Хуудасны толгой, хөлийн мэдээлэл
  const clone = preview.cloneNode(true);
  clone.querySelectorAll('.doc-head, .doc-foot').forEach(el => el.remove());
  const head = headerHTML('page-head');

  // Хуудасны хөл: @page margin box (Chrome/Edge 131+), зүүн · гол · баруун
  const fp = footerParts();
  const foot = fp ? 'on' : '';
  const boxCSS = 'font-family: Manrope, sans-serif; font-size: 9pt; color: #4a5878;';
  const pageCSS = fp
    ? '@page { margin: 0 0 14mm;' +
        ' @bottom-left { content: ' + footerCSSContent(fp[0]) + '; ' + boxCSS + ' text-align: left; padding-left: 18mm; }' +
        ' @bottom-center { content: ' + footerCSSContent(fp[1]) + '; ' + boxCSS + ' text-align: center; }' +
        ' @bottom-right { content: ' + footerCSSContent(fp[2]) + '; ' + boxCSS + ' text-align: right; padding-right: 18mm; } }'
    : '@page { margin: 0; }';

  const bodyHTML =
    '<table class="page-wrap">' +
      '<thead><tr><td><div class="pg-space"></div>' + head + '</td></tr></thead>' +
      '<tfoot><tr><td><div class="pg-space" style="height:' + (foot ? '4mm' : '18mm') + '"></div></td></tr></tfoot>' +
      '<tbody><tr><td>' + clone.innerHTML + '</td></tr></tbody>' +
    '</table>';

  const doc = win.document;
  doc.open();
  doc.write(
    '<!DOCTYPE html><html lang="mn"><head><meta charset="utf-8">' +
    '<title>' + escHTML(title) + '</title>' +
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">' +
    '<style>' + pageCSS + printCSS + '</style></head><body>' + bodyHTML + '</body></html>'
  );
  doc.close();
  doc.title = title;

  // Хэвлэх цонх хаагдсаны дараа (хадгалсан ч, цуцалсан ч) таб өөрөө хаагдана
  const go = () => { win.focus(); win.print(); win.close(); };
  const run = () => {
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(() => setTimeout(go, 300));
    else setTimeout(go, 600);
  };

  if (doc.readyState === 'complete') run();
  else win.onload = run;
}

// ===== Файл нээх =====
function loadText(name, text, handle) {
  fileHandle = handle || null;
  setDocOpen(true);
  setFileName(name);
  closeImgPanel();
  input.value = stashImages(text);
  render();
  setDirty(false);
  input.scrollTop = 0;
  preview.scrollTop = 0;
}

// Засвар орсон бол эхлээд хадгалах эсэхийг асууна
async function openFile() {
  if (dirty) {
    const c = await showModal({
      title: 'Хадгалаагүй байна',
      text: '«' + currentName() + '» Файлд засвар орсон байна. Хадгалах уу?',
      buttons: [
        { label: 'Буцах', value: 'cancel' },
        { label: 'Хадгалахгүй', value: 'discard', cls: 'mbtn-danger' },
        { label: 'Хадгалах', value: 'save', cls: 'mbtn-main', icon: 'ti-download' }
      ]
    });
    if (c === 'cancel') return;
    if (c === 'save' && !(await saveFile())) return;
  }

  if (fsOk) {
    try {
      const [h] = await window.showOpenFilePicker({ types: MD_TYPES, multiple: false });
      const f = await h.getFile();
      loadText(f.name, await f.text(), h);
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      if (!fsFailed(e)) { console.error(e); alert('Файл нээж чадсангүй: ' + e.message); return; }
    }
  }
  document.getElementById('file-open-input').click();
}

// Apps Script дотор: энгийн файл сонгогчоор нээнэ (дарж хадгалах боломжгүй)
function loadFile(event) {
  const f = event.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = e => loadText(f.name, e.target.result);
  reader.readAsText(f, 'utf-8');
  event.target.value = '';
}

// Файл нээлттэй эсэх: хаагдсан үед зөвхөн «Нээх» идэвхтэй
let docOpen = true;
function setDocOpen(v) {
  docOpen = v;
  document.querySelectorAll('.toolbar .tgroup button, .ph-actions button:not([onclick="openFile()"])')
    .forEach(b => { b.disabled = !v; });
}

// Файлыг хаагаад хоосон баримтаар эхэлнэ (хадгалаагүй бол эхлээд асууна)
async function closeDoc() {
  if (dirty) {
    const c = await showModal({
      title: 'Файлд өөрчлөлт хийсэн байна',
      text: '«' + currentName() + '» Файлын өөрчлөлтийг хадгалах уу?',
      buttons: [
        { label: 'Цуцлах', value: 'cancel' },
        { label: 'Хадгалахгүй', value: 'discard', cls: 'mbtn-danger' },
        { label: 'Хадгалах', value: 'save', cls: 'mbtn-main', icon: 'ti-download' }
      ]
    });
    if (c === 'cancel') return;
    if (c === 'save' && !(await saveFile())) return;
  }
  loadText('statement.md', '');
  setDocOpen(false);
  input.focus();
}

// Харах цонхыг асуухгүй шууд хаана (засварлах цонхон дахь MD файл хэвээр)
function closePreview() {
  setLayout('edit');
}

// Хуудсыг хаах/сэргээх үед хадгалаагүй бол анхааруулна
window.addEventListener('beforeunload', e => {
  if (dirty) { e.preventDefault(); e.returnValue = ''; }
});

// Товчлол: Ctrl+S — хадгалах, Esc — зургийн самбар хаах
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('modal').hidden) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && docOpen) {
    e.preventDefault();
    saveFile();
  } else if (e.key === 'Escape' && ipIdx >= 0) {
    closeImgPanel();
  }
});

// ===== Эхлүүлэх =====
applySplit();
input.value = defaultMd;
render();
setDirty(false);
</script>
