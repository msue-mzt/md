<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>Онгоц хайх тоглоом</title>
<style>
  :root {
    --bg: #fbf7ee;
    --panel: #ffffff;
    --border: #d8d2c4;
    --text: #3b3a35;
    --muted: #8a8676;
    --accent: #4f8c5a;
    --accent-soft: #cfe3d2;
    --warn: #e0a64a;
    --warn-soft: #f6e4c5;
    --null: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .field {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    box-shadow: var(--shadow);
    font-size: 14px;
  }
  .field label { color: var(--muted); }
  .field select {
    border: none;
    background: transparent;
    font: inherit;
    color: var(--text);
    cursor: pointer;
    padding: 2px 4px;
  }
  button.btn {
    border: 1px solid var(--border);
    background: var(--panel);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    font: inherit;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: background .15s;
  }
  button.btn:hover { background: #f3eee2; }
  .stat {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
    box-shadow: var(--shadow);
  }
  .stat b { color: var(--text); font-weight: 600; }
  .stat span { color: var(--muted); }

  .board-wrap {
    display: flex;
    justify-content: center;
    margin: 18px 0;
  }
  .board {
    display: grid;
    gap: 4px;
    user-select: none;
  }
  .cell {
    width: 30px; height: 30px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: transparent;
    transition: background .12s, color .12s, transform .05s;
  }
  .cell:hover:not(.revealed) { background: #f5efe1; }
  .cell:active { transform: scale(0.95); }
  .cell.ok      { background: var(--accent);       color: #fff; border-color: var(--accent); }
  .cell.yes     { background: var(--warn);         color: #fff; border-color: var(--warn); }
  .cell.null    { background: #eeeae0;             color: var(--muted); border-color: var(--border); }
  .cell.nose    { background: #d8482f;             color: #fff; border-color: #d8482f; font-weight: 700; }
  .cell.peek-ok  { background: var(--accent-soft); color: var(--accent); }
  .cell.peek-yes { background: var(--warn-soft);   color: var(--warn); }

  .status {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }
  .status.win { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .status.lose { background: #f8d7d2; border-color: #d8482f; color: #b03520; font-weight: 600; }

  .legend, .preview {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .swatch { display: inline-flex; align-items: center; gap: 8px; }
  .swatch i {
    width: 16px; height: 16px;
    border-radius: 4px; border: 1px solid var(--border);
    display: inline-block;
  }
  .swatch i.ok   { background: var(--accent); border-color: var(--accent); }
  .swatch i.yes  { background: var(--warn);   border-color: var(--warn); }
  .swatch i.null { background: var(--null); }
  .swatch i.nose { background: #d8482f;       border-color: #d8482f; }

  .preview-title { width: 100%; color: var(--muted); margin-bottom: 4px; font-size: 13px; }
  .mini {
    display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .mini-label { font-size: 12px; color: var(--muted); }
  .mini-grid {
    display: grid; gap: 1px; background: transparent;
  }
  .mini-cell {
    width: 8px; height: 8px; border-radius: 1px;
  }
  .mini-cell.s { background: var(--accent); }
  .mini-cell.n { background: #d8482f; }
  .mini-cell.d { background: var(--accent-soft); }
  .mini-cell.e { background: transparent; }

  @media (max-width: 520px) {
    .cell { width: 26px; height: 26px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="field">
      <label>Хэмжээ</label>
      <select id="sizeSel">
        <option>8</option><option selected>10</option><option>12</option><option>14</option>
      </select>
    </div>
    <div class="field">
      <label>Дүрс</label>
      <select id="countSel">
        <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option>
      </select>
    </div>
    <div class="field">
      <label>Хугацаа</label>
      <select id="timeSel">
        <option>30</option><option selected>60</option><option>90</option><option>120</option><option>180</option>
      </select>
      <span style="color:var(--muted)">c</span>
    </div>
    <button class="btn" id="newBtn">↻ Шинэ тоглоом</button>
    <button class="btn" id="peekBtn">👁 Бүгдийг үзүүлэх</button>
  </div>

  <div class="row">
    <div class="stat"><span>Алхам</span><b id="moves">0</b></div>
    <div class="stat"><span>Олсон</span><b id="found">0/0</b></div>
    <div class="stat"><span>Хугацаа</span><b id="time">0c</b></div>
    <div class="stat"><span>Оноо</span><b id="score">0</b></div>
    <div class="stat"><span>Дээд оноо</span><b id="hi">0</b></div>
  </div>

  <div class="board-wrap"><div class="board" id="board"></div></div>

  <div class="status" id="status">Тоглоом эхэллээ. Аль ч нүдэнд дар.</div>

  <div class="legend">
    <div class="swatch"><i class="nose"></i> Хошуу — онгоц сөнөнө</div>
    <div class="swatch"><i class="ok"></i> OK — од (*)</div>
    <div class="swatch"><i class="null"></i> NULL — хоосон</div>
  </div>

  <div class="preview" id="preview">
    <div class="preview-title">4 боломжит чиглэл:</div>
  </div>
</div>

<script>
  // Үндсэн "онгоц" хэлбэр (4 мөр × 3 багана)
  //   . * .
  //   * * *
  //   . * .
  //   * * *
  const BASE = [
    "..*..",  // нөөц мөр (унших боломжтой) — ашиглахгүй
  ];
  // Зөв BASE дахин:
  const SHAPE_PATTERN = [
    ".*.",
    "***",
    ".*.",
    "***"
  ];

  function patternToCells(pat) {
    const cells = [];
    for (let r = 0; r < pat.length; r++)
      for (let c = 0; c < pat[r].length; c++)
        if (pat[r][c] === '*') cells.push([r, c]);
    return cells;
  }
  function bbox(cells) {
    let h = 0, w = 0;
    for (const [r, c] of cells) { if (r + 1 > h) h = r + 1; if (c + 1 > w) w = c + 1; }
    return [h, w];
  }
  function rotate90(cells, h /*, w*/) {
    return cells.map(([r, c]) => [c, h - 1 - r]);
  }
  function normalize(cells) {
    let mr = Infinity, mc = Infinity;
    for (const [r, c] of cells) { if (r < mr) mr = r; if (c < mc) mc = c; }
    return cells.map(([r, c]) => [r - mr, c - mc]);
  }

  function buildOrientations() {
    let cells = patternToCells(SHAPE_PATTERN);
    let nose = [0, 1]; // үндсэн чиглэлийн хошуу
    const orientations = [];
    for (let i = 0; i < 4; i++) {
      let mr = Infinity, mc = Infinity;
      for (const [r, c] of cells) { if (r < mr) mr = r; if (c < mc) mc = c; }
      const ncells = cells.map(([r, c]) => [r - mr, c - mc]);
      const nnose = [nose[0] - mr, nose[1] - mc];
      orientations.push({ cells: ncells, nose: nnose });
      let h = 0;
      for (const [r] of ncells) if (r + 1 > h) h = r + 1;
      cells = ncells.map(([r, c]) => [c, h - 1 - r]);
      nose = [nnose[1], h - 1 - nnose[0]];
    }
    return orientations;
  }
  const ORIENTATIONS = buildOrientations();

  // Тоглоомын төлөв
  let n = 10;
  let numShapes = 3;
  let board = [];     // 'star' | 'dot' | 'empty'
  let shapeOf = [];   // тухайн нүд аль дүрсэд хамрагдах эсвэл -1
  let starCells = []; // бүх "*" нүднүүд
  let noseSet = new Set();   // хошууны нүднүүд "r,c"
  let killedShapes = new Set(); // сөнөсөн дүрсийн индекс
  let revealed = new Set();
  let foundStars = new Set();
  let moves = 0;
  let started = false;
  let timerId = null;
  let initialSec = 60;
  let timeLeft = 60;
  let won = false;
  let lost = false;
  const HS_KEY = 'ongots-highscore';

  const $ = id => document.getElementById(id);

  function placeShapes() {
    board = Array.from({length: n}, () => Array(n).fill('empty'));
    shapeOf = Array.from({length: n}, () => Array(n).fill(-1));
    starCells = [];
    noseSet = new Set();
    killedShapes = new Set();
    let placed = 0, tries = 0;
    while (placed < numShapes && tries < 5000) {
      tries++;
      const orient = ORIENTATIONS[Math.floor(Math.random() * 4)];
      const cellsRel = orient.cells;
      const noseRel = orient.nose;
      const [h, w] = bbox(cellsRel);
      if (h > n || w > n) continue;
      const r0 = Math.floor(Math.random() * (n - h + 1));
      const c0 = Math.floor(Math.random() * (n - w + 1));
      let clash = false;
      for (const [dr, dc] of cellsRel) {
        const r = r0 + dr, c = c0 + dc;
        for (let rr = r - 1; rr <= r + 1 && !clash; rr++)
          for (let cc = c - 1; cc <= c + 1 && !clash; cc++)
            if (rr >= 0 && rr < n && cc >= 0 && cc < n && board[rr][cc] !== 'empty') clash = true;
        if (clash) break;
      }
      if (clash) continue;
      for (const [dr, dc] of cellsRel) {
        const r = r0 + dr, c = c0 + dc;
        board[r][c] = 'star';
        shapeOf[r][c] = placed;
        starCells.push([r, c]);
      }
      noseSet.add((r0 + noseRel[0]) + ',' + (c0 + noseRel[1]));
      // "Хажууд" (dot) тэмдэглэл үүсгэхгүй — бүгд NULL-тай адил хоосон үлдэнэ.
      placed++;
    }
    return placed === numShapes;
  }

  function buildBoard() {
    const el = $('board');
    el.innerHTML = '';
    el.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const c = document.createElement('div');
        c.className = 'cell';
        c.dataset.r = i; c.dataset.c = j;
        c.addEventListener('click', onCellClick);
        el.appendChild(c);
      }
    }
  }

  function cellEl(r, c) {
    return $('board').children[r * n + c];
  }

  function onCellClick(e) {
    if (won || lost) return;
    const r = +e.currentTarget.dataset.r;
    const c = +e.currentTarget.dataset.c;
    const key = r + ',' + c;
    if (revealed.has(key)) return;
    if (!started) startTimer();
    revealed.add(key);
    moves++;
    const v = board[r][c];
    const el = e.currentTarget;
    if (v === 'star') {
      if (noseSet.has(key)) {
        // Хошуун — дүрс сөнөнө. Зөвхөн хошууг улаанаар тэмдэглэнэ.
        el.classList.add('nose'); el.textContent = '*';
        const sIdx = shapeOf[r][c];
        killedShapes.add(sIdx);
        for (const [sr, sc] of starCells) {
          if (shapeOf[sr][sc] === sIdx) foundStars.add(sr + ',' + sc);
        }
        setStatus('🎯 Хошуун! Онгоц сөнөв.');
      } else {
        // Жирийн од: ногооноор
        el.classList.add('ok'); el.textContent = '*';
        foundStars.add(key);
        const sIdx = shapeOf[r][c];
        setStatus(killedShapes.has(sIdx) ? 'Сөнөсөн биеийн од.' : 'OK — од оноолоо!');
      }
    } else {
      // 'dot' болон 'empty' хоёулаа NULL — хоосон гэж үзнэ.
      el.classList.add('null'); el.textContent = '·';
      setStatus('NULL — хоосон.');
    }
    el.classList.add('revealed');
    updateStats();
    checkWin();
  }

  function setStatus(msg, win=false, lose=false) {
    const s = $('status');
    s.textContent = msg;
    s.classList.toggle('win', win);
    s.classList.toggle('lose', lose);
  }

  function updateStats() {
    $('moves').textContent = moves;
    $('found').textContent = `${foundStars.size}/${starCells.length}`;
  }

  function startTimer() {
    started = true;
    timeLeft = initialSec;
    $('time').textContent = timeLeft + 'c';
    timerId = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        timeLeft = 0;
        $('time').textContent = '0c';
        stopTimer();
        gameOver();
        return;
      }
      $('time').textContent = timeLeft + 'c';
    }, 1000);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function calcScore() {
    if (moves === 0) return 0;
    const minMoves = numShapes; // онилзон 1 хошуунд = 1 алхам
    const efficiency = Math.round((minMoves / moves) * 800);
    const timeBonus = timeLeft * 5;
    return Math.max(0, efficiency + timeBonus);
  }

  function getHighScore() {
    try { return parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveHighScore(s) {
    try { localStorage.setItem(HS_KEY, String(s)); } catch (e) {}
  }
  function refreshHi() { $('hi').textContent = getHighScore(); }

  function gameOver() {
    lost = true;
    setStatus(`⏰ Хугацаа дуусла! ${foundStars.size}/${starCells.length} од олсон.`, false, true);
  }

  function checkWin() {
    if (foundStars.size === starCells.length && starCells.length > 0) {
      won = true;
      stopTimer();
      const score = calcScore();
      $('score').textContent = score;
      const hi = getHighScore();
      let extra = '';
      if (score > hi) { saveHighScore(score); refreshHi(); extra = ' ✨ Шинэ дээд оноо!'; }
      setStatus(`🎉 Та хожлоо! ${moves} алхам, ${initialSec - timeLeft}c. Оноо: ${score}.${extra}`, true);
    }
  }

  function peekAll() {
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const key = i + ',' + j;
        if (revealed.has(key)) continue;
        const el = cellEl(i, j);
        const v = board[i][j];
        el.classList.remove('peek-ok', 'peek-yes');
        if (v === 'star') {
          if (noseSet.has(key)) { el.classList.add('nose'); el.textContent = '*'; }
          else { el.classList.add('peek-ok'); el.textContent = '*'; }
        }
      }
    }
    setStatus('Бүх дүрсийг үзүүллээ. Улаан = хошуу.');
  }

  function newGame() {
    n = parseInt($('sizeSel').value, 10);
    numShapes = parseInt($('countSel').value, 10);
    initialSec = parseInt($('timeSel').value, 10);
    timeLeft = initialSec;
    revealed = new Set();
    foundStars = new Set();
    moves = 0;
    won = false;
    lost = false;
    started = false;
    stopTimer();
    $('time').textContent = initialSec + 'c';
    $('score').textContent = '0';
    refreshHi();
    if (!placeShapes()) {
      buildBoard();
      setStatus('Талбай хэт жижиг — хэмжээг ихэсгэ эсвэл дүрсийн тоог бууруул.');
      $('found').textContent = `0/0`;
      $('moves').textContent = '0';
      return;
    }
    buildBoard();
    updateStats();
    setStatus(`Тоглоом эхэллээ. ${initialSec}c хугацаатай. Хошууг онилбол хурдан хожно.`);
  }

  function buildPreview() {
    const wrap = $('preview');
    const labels = ['0°', '90°', '180°', '270°'];
    ORIENTATIONS.forEach((orient, i) => {
      const [h, w] = bbox(orient.cells);
      const set = new Set(orient.cells.map(([r, c]) => r + ',' + c));
      const noseKey = orient.nose[0] + ',' + orient.nose[1];
      const m = document.createElement('div'); m.className = 'mini';
      const lab = document.createElement('div'); lab.className = 'mini-label'; lab.textContent = labels[i];
      const grid = document.createElement('div');
      grid.className = 'mini-grid';
      grid.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
      for (let r = 0; r < h; r++)
        for (let c = 0; c < w; c++) {
          const mc = document.createElement('div');
          const k = r + ',' + c;
          let cls = 'e';
          if (set.has(k)) cls = (k === noseKey) ? 'n' : 's';
          mc.className = 'mini-cell ' + cls;
          grid.appendChild(mc);
        }
      m.appendChild(grid); m.appendChild(lab);
      wrap.appendChild(m);
    });
  }

  $('newBtn').addEventListener('click', newGame);
  $('peekBtn').addEventListener('click', peekAll);
  $('sizeSel').addEventListener('change', newGame);
  $('countSel').addEventListener('change', newGame);
  $('timeSel').addEventListener('change', newGame);

  buildPreview();
  newGame();
</script>
</body>
</html>
